<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <link rel="stylesheet" href="styles.css">
    <title>App de Viajes</title>
</head>
<body>

<div class="container">

    <h1>Planificador de Viajes</h1>

    <form id="formViaje">
        <input type="text" id="destino" placeholder="Destino" required>
        <input type="date" id="fecha" required>

        <select id="transporte">
            <option value="Avión">Avión</option>
            <option value="Tren">Tren</option>
        </select>

        <input type="number" id="personas" min="1" value="1">

        <button type="submit">Agregar Viaje</button>
    </form>

    <h2>Itinerario</h2>
    <div id="itinerario"></div>

</div>

<script type="module" src="app.js"></script>
</body>
</html>
