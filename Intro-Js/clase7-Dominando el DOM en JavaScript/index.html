<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Lista de Super</title>
</head>
<body>
    <h1>Escribe tus Productos</h1>

    <div>

    <main>
        <ul id="iteamList"></ul>

        <hr>

        <label for="select_tareas">Categoria:</label>

        <div>

        <div>
            <h3>Importante</h3>
            <ul id="LImportante"></ul>
        </div>
        <div>
            <h3>Para Despues</h3>
            <ul id="LPara_Despues"></ul>
        </div>
        <div>
            <h3>Siguiente Semana</h3>

    </main>

    
    
    <script src="dom2.js"></script>
