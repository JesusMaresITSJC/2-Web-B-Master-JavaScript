<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Password Generator</title>
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <div class="container">
    <h1>Password Generator</h1>
    <div>
      <input type="text" id="password" readonly>
      <span class="copy-btn" id="copyBtn">📋</span>
    </div>

    <div class="slider-container">
      <label for="length">Character Length: <span id="lengthValue">8</span></label>
      <input type="range" id="length" min="4" max="32" value="8">
    </div>

    <div class="options">
      <label><input type="checkbox" id="uppercase" checked> Include Uppercase Letters</label>
      <label><input type="checkbox" id="lowercase" checked> Include Lowercase Letters</label>
      <label><input type="checkbox" id="numbers" checked> Include Numbers</label>
      <label><input type="checkbox" id="symbols" checked> Include Symbols</label>
    </div>

    <div class="strength" id="strength">STRENGTH: </div>
    <button id="generateBtn">GENERATE →</button>
  </div>

  <script src="funciones.js"></script>
</body>
</html>
